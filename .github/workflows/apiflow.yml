name: ApiFlow CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test backend
        working-directory: backend
        run: mvn -q test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build VS Code extension
        working-directory: vscode-extension
        run: |
          npm install
          npm run compile

  cli-smoke:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Start backend and smoke-test CLI
        working-directory: backend
        run: |
          mvn -q -DskipTests spring-boot:run &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/workspace && break; sleep 2; done
          cd ..
          chmod +x ./apiflow
          ./apiflow export "Default" --format bruno || true
          ./apiflow report "Default" --format html --out /tmp/apiflow-report.html || true

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, extension]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t apiflow:ci .
